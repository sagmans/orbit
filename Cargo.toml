[package]
name = "orbit"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Run coding-agent CLIs inside constrained containers with auditable host-mount policy"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
signal-hook = "0.3"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
